apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-dg-service.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "DG",
        "GameExternalId": "dg"
      },
      "GameRecord": {
        "GameProvidersServiceBaseUrl": "http://game-gameproviders/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRoundsServiceBaseUrl": "http://game-gamerounds/"
      },
      "DGTFGameRecordInfo": {
        "GameProviderCode": "DGTF",
        "IntervalMinutes": 5,
        "IntervalMinutesMax": 1440,
        "IntervalMinutesMinimum": 2,
        "LockMinute": 4
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
