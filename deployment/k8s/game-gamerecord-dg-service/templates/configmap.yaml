apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-dg-service.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "DG",
        "GameProviderConfig": "DGConfiguration",
        "GameProviderCodeTransfer": "DGTF",
        "GameProviderConfigTransfer": "DGTFConfiguration",
        "GameExternalId": "dg",
        "LockMinute": 10
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRoundsServiceBaseUrl": "http://game-gamerounds/",
        "GameInterfaceBaseUrl": "http://game-gameinterface-dg-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
