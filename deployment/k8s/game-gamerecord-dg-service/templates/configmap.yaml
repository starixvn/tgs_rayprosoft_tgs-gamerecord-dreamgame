apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-dg-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "DG",
        "GameExternalId": "dg",
        "MongoDefine": "gp.gamerecord.database",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.round.dg"
      },
      "NatsSetting": {
        "Group": "gp.gamerecord.schedule",
        "Subject": "gp.gamerecord.schedule.dg"
      },
      "GameRecord": {
        "GameProvidersServiceBaseUrl": "http://game-gameproviders/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRoundsServiceBaseUrl": "http://game-gamerounds/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
