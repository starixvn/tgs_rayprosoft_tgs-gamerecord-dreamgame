apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-dg-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "MongoDBMessagingConnectionString": "{{ .Values.connectionStrings.mongo_messaging }}",
        "NatsMQ": "{{ .Values.nats.urls }}"
      },
      "GameRecord": {
        "GameProvidersBaseUrl": "http://game-gameproviders",
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver"
      },
      "RabbitMQ": {
        "RabbitMQUrl": "{{ .Values.rabbit.url }}",
        "UserName": "{{ .Values.rabbit.user }}",
        "Password": "{{ .Values.rabbit.password }}",
        "VirtualHost": "{{ .Values.rabbit.vhost  }}"
      }
    }
