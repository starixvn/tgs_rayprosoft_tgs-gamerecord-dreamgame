# Default values for game-gamerecord-dg-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.rpgp.cc/tgs/game-gamerecord-dg-service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

namespace: dev

imagePullSecrets: 
  - name: secret-tgs-harbor
nameOverride: "game-gamerecord-dg-service"
fullnameOverride: "game-gamerecord-dg-service"

connectionStrings:
  mongo_messaging: mongodb://admin:abcd1234@192.168.50.111/messaging?retryWrites=true&w=majority&authSource=admin

nats:
  urls: nats://nats-client:4222

rabbit:
  url: amqp://localhost:5672
  user: devadmin
  password: devadmin
  vhost: /devhost

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources: 
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
